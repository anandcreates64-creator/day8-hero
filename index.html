<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anand | Websites for Small Business</title>
<link rel="icon" type="image/png" href="/logo.png">
<meta name="description" content="I build fast and simple websites for small businesses without WordPress.">
<meta name="author" content="Anand">
<meta property="og:title" content="Anand - Websites for Small Business">
<meta property="og:description" content="I build fast custom websites without WordPress.">
<meta property="og:image" content="https://day8-hero.pages.dev/og-image.jpg">
<meta property="og:url" content="https://day8-hero.pages.dev/">
<meta property="og:type" content="website">
<style>
body { background-color: #0a0a0a; color: white; text-align: center; font-family: Arial, sans-serif; padding: 20px; }
h1 { color: #00ff88; font-size: 42px; }
p { color: #888; }
button { background-color: #00ff88; color: black; padding: 12px 30px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; }
input, textarea { padding: 12px 20px; border-radius: 8px; border: none; width: 80%; max-width: 300px; margin-top: 15px; }
textarea { height: 80px; }
html { scroll-behavior: smooth; }
</style>
</head>
<body>

<h1>Hi, I'm Anand</h1>
<p>I build simple and fast websites for small businesses</p>
<a href="#projects"><button>My Work</button></a>

<div style="margin-top:50px; padding:30px; background:#111; border-radius:15px;">
<h2>About Me</h2>
<p>I build fast custom websites without WordPress.</p>

<form id="contact-form">
<input name="name" type="text" placeholder="Your Name" required maxlength="50" />
<br>
<input name="email" type="email" placeholder="Enter your email" required maxlength="100" />
<br>
<textarea name="message" placeholder="Your message" required maxlength="300"></textarea>
<br><br>
<button type="submit">Submit</button>
</form>
</div>

<div id="projects" style="margin-top:50px; padding:30px; background:#111; border-radius:15px;">
<h2>My Projects</h2>
<div style="display:grid; gap:20px; margin-top:20px;">
  <div style="border:1px solid #333; padding:20px; border-radius:10px;">
    <h3 style="color:#00ff88; margin:0;">Barber Shop Website</h3>
    <p>Booking website for local barber shop</p>
  </div>
  <div style="border:1px solid #333; padding:20px; border-radius:10px;">
    <h3 style="color:#00ff88; margin:0;">Cafe Landing Page</h3>
    <p>Fast landing page for a cafe in Gurugram</p>
  </div>
</div>
</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbzxwVr9MROGJTJpDqW2jXESkHL3AS7EkPMmYkcIzRem60sRvWtJ1myPQ3JJ2py2chKR0w/exec';
const form = document.getElementById('contact-form');
form.addEventListener('submit', e => {
  e.preventDefault();
  const btn = form.querySelector('button');
  btn.innerText = 'Sending...';
  
  const formData = new FormData(form);
  formData.append("secret", "anand2026_secure");

  fetch(scriptURL, { method: 'POST', body: formData})
    .then(() => {
      alert("Thanks! Your message has been sent.");
      form.reset();
      btn.innerText = 'Submit';
    })
    .catch(error => {
      alert("Error! " + error.message);
      btn.innerText = 'Submit';
    });
});
</script>

</body>
</html>
