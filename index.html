<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background-color: #0a0a0a;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  padding: 20px;
}
h1 {
  color: #00ff88;
  font-size: 42px;
}
p {
  color: #888;
}
button {
  background-color: #00ff88;
  color: black;
  padding: 12px 30px;
  border-radius: 50px;
  border: none;
  font-weight: bold;
  margin-top: 10px;
}
input {
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  width: 80%;
  max-width: 300px;
  margin-top: 15px;
  }
</style>
</head>
<body>

<h1>Hi, I'm Anand</h1>
<p>I build simple and fast websites for small businesses</p>
<button>My Work</button>
  <div style="margin-top:50px; padding:30px; background:#111; border-radius:10px;">
  <h2>About Me</h2>
  <p>I build fast custom websites without WordPress.</p>
  <input id="email" type="email" placeholder="Enter your email" style="padding:12px 20px; border-radius:8px; width:80%; max-width:300px;">
  <br><br>
  <button id="btn" style="background:#00ff88; color:black; border-radius:50px; padding:12px 30px;">Contact Me</button>
</div>

<script>
  const btn = document.getElementById('btn');
  const emailBox = document.getElementById('email');

  btn.addEventListener('click', function() {
    if(emailBox.value === "") {
      alert("Please enter your email");
    } else {
      alert("Thank you! We received your email: " + emailBox.value);
    }
  });
</script>
</body>
</html>
